function cleanHeader_(v){return String(v||'').replace(/[\s_()（）]/g,'').trim();}

function number_(v,label,min,max){const s=text_(v);if(!s)return null;const n=Number(s);if(!Number.isFinite(n)||n<min||n>max)throw Error(label+': 숫자 범위를 확인해 주세요.');return n;}
function age_(y,m,label){if(!text_(y)&&!text_(m))return null;if(!text_(y)||!text_(m))throw Error(label+': 세와 개월을 모두 입력해 주세요.');const yr=number_(y,label,0,30),mo=number_(m,label,0,11);if(!Number.isInteger(yr)||!Number.isInteger(mo))throw Error(label+': 정수로 입력해 주세요.');return yr*12+mo;}
function hormone_(v,label){const s=text_(v);if(s&&!/^(?:<=|>=|<|>|≤|≥)?\s*\d+(?:\.\d+)?$/.test(s))throw Error(label+': 숫자 또는 <5 형식으로 입력해 주세요.');return s;}

function parseGrowthGrids_(grids){
  const patientTables=[],visitTables=[];
  grids.forEach(grid=>grid.values.forEach((row,r)=>{
    const headers=row.map(cleanHeader_);let kind=null;
    if(headers.includes('진료기록ID')&&headers.includes('차트번호')&&headers.includes('내원일'))kind='visits';
    else if(headers.includes('차트번호')&&headers.includes('환자명'))kind='patients';
    if(!kind)return;
    const map={};headers.forEach((h,i)=>{if(h){if(Object.prototype.hasOwnProperty.call(map,h))throw Error(grid.name+' '+(r+1)+'행: 중복 열 제목 '+h);map[h]=i;}});
    (kind==='patients'?patientTables:visitTables).push({grid,start:r,map});
  }));
  if(!patientTables.length&&!visitTables.length)return {legacySource:legacyRows_(grids)};
  if(!patientTables.length||!visitTables.length)throw Error('환자목록과 진료기록 표의 제목을 모두 확인해 주세요. 일부 표만 인식되어 적용하지 않았습니다.');

  patientTables.forEach(t=>rows(t,(get,loc)=>{
    const id=required_(text_(get('차트번호')),loc+': 차트번호가 없습니다.'),name=required_(text_(get('환자명')),loc+': 환자명이 없습니다.');

  }));
  visitTables.forEach(t=>rows(t,(get,loc)=>{
    const id=required_(text_(get('진료기록ID')),loc+': 진료기록ID가 없습니다.'),pid=required_(text_(get('차트번호')),loc+': 차트번호가 없습니다.');

    if(!['내원','예정'].includes(status)||!['확인','미확정'].includes(dateStatus))throw Error(loc+': 기록구분(내원/예정) 또는 날짜확인(확인/미확정)을 확인해 주세요.');
    const date=date_(get('내원일'),loc),pending=dateStatus==='미확정';if(!date&&!pending)throw Error(loc+': 내원일을 입력하거나 날짜확인을 미확정으로 설정해 주세요.');
    const context={'조건 미기재':'unspecified','미기재':'unspecified','기저 검사':'basal','투여 후 60분':'post60','기타':'other','기타 조건':'other'},condition=text_(get('검사조건'))||'조건 미기재';
    if(!context[condition])throw Error(loc+': 검사조건은 조건 미기재, 기저 검사, 투여 후 60분, 기타 중 하나입니다.');

function legacyRows_(grids){
  const rows=[],seenPatients=new Set();let virtualRow=1000;
  const aliases={'CA':'E','BA':'F','p/ex':'G','키':'H','키cm':'H','몸무게':'I','몸무게kg':'I','BMI':'J','특이사항':'M','진료메모':'M','내원일':'B','진료내용':'C','주사':'C','아빠/엄마/유전/예상키':'K','아빠/엄마/유전예상키':'K','아빠/엄마/유전':'K'};
  grids.forEach(grid=>{
    let heads=[];const maps=[];
    grid.values.forEach((row,r)=>{
      const title=[];row.forEach((cell,c)=>{const match=text_(cell).match(/^(\d{3,12})\s*([가-힣]{2,5})(?:\s|\(|$)/);if(match)title.push({r,c,id:match[1]});});
      if(title.length>1)throw Error(grid.name+' '+(r+1)+'행: 같은 행에 여러 환자 묶음이 있어 구분할 수 없습니다. 환자 묶음을 세로로 배치해 주세요.');
      heads.push(...title);
      const map={};row.forEach((cell,c)=>{const h=cleanHeader_(cell);if(aliases[h])map[aliases[h]]=c;});
      if(map.E!=null&&map.F!=null&&map.H!=null)maps.push({r,map});
    });
    const sideHeads=heads.filter(h=>maps.length&&h.c>Math.min(...maps.map(m=>m.map.E)));
    heads=heads.filter(h=>!sideHeads.includes(h));
    heads.forEach((head,i)=>{
      if(seenPatients.has(head.id))throw Error('차트번호 '+head.id+'가 여러 묶음에 있습니다. 한 환자의 기록을 한 묶음에 모아 주세요.');seenPatients.add(head.id);
      const end=heads[i+1]?.r??grid.values.length;
      const before=maps.filter(m=>m.r<=head.r).at(-1),after=maps.find(m=>m.r>head.r);
      const header=before||after;
      if(!header)throw Error(grid.name+': CA, BA, 키 제목이 있는 행이 필요합니다.');
      const base=head.c,defaultMap={A:base,B:base+1,C:base+2,D:base+3,E:base+4,F:base+5,G:base+6,H:base+7,I:base+8,J:base+9,K:base+10,M:base+12,O:base+14,P:base+15};
      const map=Object.assign(defaultMap,header.map);map.A=base;
      for(let r=head.r;r<end;r++){

  });

const SHARED_SHEET_ID='1KeUKxRjIpWoclFTCgG6D4QYXTwRNPL9qWxgMGMcfByA';
async function fetchDirect(){
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),25000);
 try{
  const response=await fetch(`https://docs.google.com/spreadsheets/d/${SHARED_SHEET_ID}/export?format=xlsx&_=${Date.now()}`,{cache:'no-store',credentials:'omit',signal:ctl.signal});
  if(!response.ok||/text\/html/i.test(response.headers.get('content-type')||''))throw Error('구글 시트를 읽을 수 없습니다. 문서의 읽기 공유 권한을 확인해 주세요.');
  const grids=await workbookGrids(await response.arrayBuffer());
  const parsed=parseGrowthGrids_(grids),body=JSON.stringify(parsed);
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(body));
  const revision=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
  const sheetUrl=`https://docs.google.com/spreadsheets/d/${SHARED_SHEET_ID}/edit`;
  return revision===sync.revision?{unchanged:true,revision,sheetUrl}:{...parsed,revision,sheetUrl};
 }finally{clearTimeout(timer);}
}
